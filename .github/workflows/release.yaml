name: Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - 'windows-latest'
        go-version:
        - '1.26.x'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout=30m

  release:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os:
        - 'windows-latest'
        go-version:
        - '1.26.x'
        # List of GOOS and GOARCH pairs from `go tool dist list`
        goosarch:
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
          - darwin/amd64
          - darwin/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Display Go version
        run: make

      - name: Get OS and arch info
        run: |
          GOOSARCH=${{ matrix.goosarch }}
          GOOS=${GOOSARCH%/*}
          GOARCH=${GOOSARCH#*/}
          BINARY_NAME=$(basename $GITHUB_REPOSITORY)-$GOOS-$GOARCH
          FLAGS="-s -w"
          if [[ "$GOOS" == "windows" ]]; then
            BINARY_NAME=$BINARY_NAME.exe
          fi
          echo "BINARY_NAME=$BINARY_NAME" | tee -a $GITHUB_ENV
          echo "FLAGS=$FLAGS" | tee -a $GITHUB_ENV
          echo "GOOS=$GOOS" | tee -a $GITHUB_ENV
          echo "GOARCH=$GOARCH" | tee -a $GITHUB_ENV

      - name: Build
        run: |
          go build -o "$BINARY_NAME" -v -ldflags "$FLAGS" ./cmd

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: ${{ env.BINARY_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
